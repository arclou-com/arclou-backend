name: API contract

on:
  pull_request:
    branches: [main]
    paths: ['docs/api/**', 'redocly.yaml']
  push:
    branches: [main]
    paths: ['docs/api/**', 'redocly.yaml']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint OpenAPI
        run: npx --yes @redocly/cli@2 lint docs/api/openapi.yaml
