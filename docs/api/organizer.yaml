openapi: 3.1.0
info:
  title: Arclou API — App do organizador
  version: 1.0.0
  summary: Contrato da API consumida pelo app mobile do organizador (inclui equipe e check-in).
  description: |
    Contrato **contract-first** (ADR-0004). O app e o backend são construídos a partir deste arquivo.

    - Guia de convenções, permissões, erros e mapa tela → endpoint: `docs/api/README.md`.
    - Site do participante: `docs/api/participant.yaml` (reaproveita autenticação, erros e tipos deste arquivo).
    - Telas e regras: `docs/produto-e-design.md`. Campos por versão: `docs/modelo-de-dominio.md`.
    - `x-since` em cada operação indica a primeira versão do backend que a implementa (V2…V8).
      O contrato descreve o produto final; o backend o implementa por partes, sem mudar formatos.
    - `x-roles` indica os papéis da produtora que podem chamar a operação
      (`OWNER`, `ADMIN`, `FINANCE`, `CHECK_IN`). Rotas sem `x-roles` dependem só de estar autenticado.
  contact:
    name: Arclou Engineering
servers:
  - url: https://api.arclou.com/v1
    description: Produção
  - url: http://localhost:8080/v1
    description: Desenvolvimento local
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Entrar, cadastro, confirmação de e-mail, senha e convites (AC-B*).
  - name: Me
    description: Conta, perfil, sessões, 2FA e notificações do usuário (PF-*, CF-B*, PN-B1).
  - name: Organizations
    description: Produtora, página pública e configurações (MA-A2, CF-A2, CF-A7).
  - name: Team
    description: Membros e convites da produtora (CF-A5).
  - name: Dashboard
    description: Painel (PN-A*).
  - name: Events
    description: Eventos, ingressos e ações do evento (EV-*).
  - name: Orders
    description: Pedidos, reembolsos e reenvios (PD-*).
  - name: Attendees
    description: Participantes do evento (EV-C4).
  - name: Check-in
    description: Portões, leitura de ingressos, sincronização offline e painel ao vivo (CK-*, EV-C5).
  - name: Payments
    description: Saldo, conta bancária e repasses (CF-A4).
  - name: Integrations
    description: Webhooks, chaves de API e pixels (CF-A6).
  - name: Exports
    description: Exportações assíncronas (CSV/PDF) e QR code.
  - name: Search
    description: Busca global (PN-B2, PN-B3).
  - name: Help
    description: Central de ajuda, suporte e documentos legais (MA-A3…A8).

paths:
  # ───────────────────────── Auth ─────────────────────────
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Entrar com e-mail e senha (AC-B1)
      description: |
        Se a conta tem 2FA e o aparelho não é confiável, responde `twoFactorRequired` com um `challengeToken`
        para usar em `/auth/login/2fa`. Após 5 tentativas erradas a conta fica bloqueada por 15 min (RN30);
        a mensagem de erro nunca diz se o e-mail existe.
      x-since: V4
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Autenticado ou 2FA exigida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '423': { $ref: '#/components/responses/AccountLocked' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/login/2fa:
    post:
      tags: [Auth]
      operationId: loginTwoFactor
      summary: Concluir login com código do autenticador ou de recuperação (AC-B2)
      x-since: V4
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TwoFactorLoginRequest' }
      responses:
        '200':
          description: Autenticado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
  /auth/passkey/options:
    post:
      tags: [Auth]
      operationId: passkeyLoginOptions
      summary: Opções WebAuthn para entrar com Face ID / passkey (AC-B1)
      x-since: V4
      security: []
      responses:
        '200':
          description: Desafio WebAuthn.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyOptions' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/passkey/verify:
    post:
      tags: [Auth]
      operationId: passkeyLoginVerify
      summary: Verificar a assinatura da passkey e entrar
      x-since: V4
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasskeyAssertion' }
      responses:
        '200':
          description: Autenticado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshTokens
      summary: Renovar tokens (rotação do refresh token)
      x-since: V4
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Novos tokens.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Sair (encerra a sessão atual)
      x-since: V4
      responses:
        '204': { description: Sessão encerrada. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/signup:
    post:
      tags: [Auth]
      operationId: signup
      summary: Criar conta — com produtora no app (AC-B3), só a conta no site (AC-A2) — RN34
      description: |
        Com `organization`, cria a conta **e** a produtora, com a pessoa como `OWNER` (app, AC-B3).
        Sem `organization`, cria só a conta (site do participante, AC-A2).
        Nos dois casos envia o código de confirmação de e-mail (RN32).
      x-since: V4
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '201':
          description: Conta criada; e-mail ainda não confirmado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignupResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/email/verify:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Confirmar e-mail com o código de 6 dígitos (AC-B6, RN32)
      x-since: V4
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verificationToken, code]
              properties:
                verificationToken: { type: string, description: Recebido em `/auth/signup`. }
                code: { type: string, pattern: '^[0-9]{6}$', example: '482913' }
      responses:
        '200':
          description: E-mail confirmado; usuário autenticado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/email/resend:
    post:
      tags: [Auth]
      operationId: resendEmailCode
      summary: Reenviar código de confirmação
      x-since: V4
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verificationToken]
              properties:
                verificationToken: { type: string }
      responses:
        '202': { description: Código reenviado (respeitando o intervalo mínimo). }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/password/forgot:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Pedir link de redefinição de senha (AC-B5, RN31)
      description: Sempre responde 202, exista ou não a conta.
      x-since: V4
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: 'Se a conta existir, o link (válido por 30 min) foi enviado.' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Definir nova senha a partir do link (AC-A5, RN31)
      x-since: V4
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 8 }
                signOutOtherDevices: { type: boolean, default: true }
      responses:
        '204': { description: Senha alterada. }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /invitations/{invitationToken}:
    parameters:
      - name: invitationToken
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Auth]
      operationId: getInvitation
      summary: Ver convite de equipe (AC-B4, RN33)
      x-since: V4
      security: []
      responses:
        '200':
          description: Convite válido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationPreview' }
        '410': { $ref: '#/components/responses/Gone' }
  /invitations/{invitationToken}/accept:
    parameters:
      - name: invitationToken
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Auth]
      operationId: acceptInvitation
      summary: Aceitar convite (cria a conta se necessário) e entrar
      x-since: V4
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, password]
              properties:
                name: { type: string, example: Júlia Rocha }
                password: { type: string, minLength: 8 }
      responses:
        '200':
          description: Membro ativo; autenticado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '410': { $ref: '#/components/responses/Gone' }
  /invitations/{invitationToken}/decline:
    parameters:
      - name: invitationToken
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Auth]
      operationId: declineInvitation
      summary: Recusar convite
      x-since: V4
      security: []
      responses:
        '204': { description: Convite recusado. }
        '410': { $ref: '#/components/responses/Gone' }

  # ───────────────────────── Me ─────────────────────────
  /me:
    get:
      tags: [Me]
      operationId: getMe
      summary: Conta atual e produtoras de que é membro (PF-A1)
      x-since: V2
      responses:
        '200':
          description: Conta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Me]
      operationId: updateMe
      summary: Atualizar dados pessoais (PF-A2)
      x-since: V2
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeUpdate' }
      responses:
        '200':
          description: Atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/photo:
    put:
      tags: [Me]
      operationId: uploadMyPhoto
      summary: Enviar foto de perfil já recortada (PF-A3)
      x-since: V3
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: 'JPG, PNG ou HEIC; recorte circular feito no app.' }
      responses:
        '200':
          description: Foto atualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
    delete:
      tags: [Me]
      operationId: deleteMyPhoto
      summary: Remover foto de perfil
      x-since: V3
      responses:
        '204': { description: Foto removida. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/password:
    put:
      tags: [Me]
      operationId: changePassword
      summary: Alterar senha (CF-B1)
      x-since: V4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
                signOutOtherDevices: { type: boolean, default: true }
      responses:
        '204': { description: Senha alterada. }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/sessions:
    get:
      tags: [Me]
      operationId: listMySessions
      summary: Aparelhos conectados (CF-A7)
      x-since: V4
      responses:
        '200':
          description: Sessões ativas.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Me]
      operationId: endOtherSessions
      summary: Encerrar todas as outras sessões
      x-since: V4
      responses:
        '204': { description: Sessões encerradas. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    delete:
      tags: [Me]
      operationId: endSession
      summary: Encerrar uma sessão
      x-since: V4
      responses:
        '204': { description: Sessão encerrada. }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/2fa/setup:
    post:
      tags: [Me]
      operationId: startTwoFactorSetup
      summary: Iniciar ativação do 2FA (CF-B2)
      description: Retorna a chave e a URI `otpauth://` para abrir direto no app autenticador (no celular) ou mostrar QR.
      x-since: V4
      responses:
        '200':
          description: Chave gerada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoFactorSetup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/2fa/activate:
    post:
      tags: [Me]
      operationId: activateTwoFactor
      summary: Confirmar código e ativar o 2FA (CF-B2 → CF-B3)
      x-since: V4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: 2FA ativo; códigos de recuperação exibidos uma única vez.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryCodes' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/2fa:
    delete:
      tags: [Me]
      operationId: disableTwoFactor
      summary: Desativar o 2FA (CF-B4) — exige senha
      x-since: V4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '204': { description: 2FA desativado. }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /me/2fa/recovery-codes:
    get:
      tags: [Me]
      operationId: getRecoveryCodesStatus
      summary: Quantos códigos de recuperação restam (CF-A7)
      x-since: V4
      responses:
        '200':
          description: Situação.
          content:
            application/json:
              schema:
                type: object
                required: [remaining, total]
                properties:
                  remaining: { type: integer, example: 8 }
                  total: { type: integer, example: 10 }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Me]
      operationId: regenerateRecoveryCodes
      summary: Gerar novos códigos (invalida os anteriores)
      x-since: V4
      responses:
        '200':
          description: Novos códigos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryCodes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/passkeys:
    get:
      tags: [Me]
      operationId: listPasskeys
      summary: Passkeys cadastradas (CF-A7)
      x-since: V4
      responses:
        '200':
          description: Passkeys.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Passkey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Me]
      operationId: registerPasskey
      summary: Registrar passkey deste aparelho
      x-since: V4
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasskeyAssertion' }
      responses:
        '201':
          description: Passkey registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Passkey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/passkeys/{passkeyId}:
    parameters:
      - name: passkeyId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Me]
      operationId: deletePasskey
      summary: Remover passkey
      x-since: V4
      responses:
        '204': { description: Removida. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/deletion-eligibility:
    get:
      tags: [Me]
      operationId: getDeletionEligibility
      summary: Verificar se a conta pode ser excluída (PF-A4, RN27)
      x-since: V4
      responses:
        '200':
          description: Pendências que impedem a exclusão (lista vazia = pode excluir).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionEligibility' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/deletion:
    post:
      tags: [Me]
      operationId: requestAccountDeletion
      summary: Excluir conta (dados pessoais apagados em até 30 dias)
      x-since: V4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, confirmation]
              properties:
                password: { type: string }
                confirmation: { type: string, const: EXCLUIR }
      responses:
        '202': { description: Exclusão agendada; todas as sessões encerradas. }
        '409': { $ref: '#/components/responses/RuleViolation' }
  /me/notifications:
    get:
      tags: [Me]
      operationId: listNotifications
      summary: Notificações (PN-B1)
      x-since: V6
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Lista paginada, mais recentes primeiro.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Notification' }
                      meta:
                        type: object
                        properties:
                          unreadCount: { type: integer, example: 3 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/notifications/read-all:
    post:
      tags: [Me]
      operationId: markAllNotificationsRead
      summary: Marcar todas como lidas
      x-since: V6
      responses:
        '204': { description: Marcadas. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/notifications/{notificationId}/read:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Me]
      operationId: markNotificationRead
      summary: Marcar uma notificação como lida (ao abrir)
      x-since: V6
      responses:
        '204': { description: Marcada. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/notification-preferences:
    get:
      tags: [Me]
      operationId: getNotificationPreferences
      summary: Preferências de notificação (CF-A3)
      x-since: V6
      responses:
        '200':
          description: Preferências.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Me]
      operationId: updateNotificationPreferences
      summary: Atualizar preferências (salvamento automático no app)
      x-since: V6
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferences' }
      responses:
        '200':
          description: Atualizadas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/devices:
    post:
      tags: [Me]
      operationId: registerPushDevice
      summary: Registrar token de push deste aparelho
      x-since: V6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, pushToken]
              properties:
                platform: { type: string, enum: [IOS, ANDROID] }
                pushToken: { type: string }
                deviceName: { type: string, example: iPhone 15 Pro }
      responses:
        '204': { description: Registrado. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────── Organizations ─────────────────────────
  /organizations/{organizationId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Organizations]
      operationId: getOrganization
      summary: Produtora, página pública e configurações (MA-A2, CF-A2)
      x-since: V4
      responses:
        '200':
          description: Produtora.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Organizations]
      operationId: updateOrganization
      summary: Atualizar página pública, configurações gerais ou regras de segurança
      description: Campos da página pública (MA-A2), `settings` (CF-A2) e `security` (CF-A7, só `OWNER`).
      x-since: V4
      x-roles: [OWNER, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationUpdate' }
      responses:
        '200':
          description: Atualizada.
