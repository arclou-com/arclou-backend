    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string, enum: [termos-de-uso, politica-de-privacidade, politica-de-reembolso, taxas-e-repasses] }
    get:
      tags: [Help]
      operationId: getLegalDocument
      summary: Documento (MA-A8)
      x-since: V3
      security: []
      responses:
        '200':
          description: Documento com seções.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalDocument' }

        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token (15 min). Renovar com `/auth/refresh`.

  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, example: org_7Kq2 }
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, example: evt_tech_summit_2026 }
    TicketTypeId:
      name: ticketTypeId
      in: path
      required: true
      schema: { type: string }
    OrderId:
      name: orderId
      in: path
      required: true
      description: ID opaco do pedido (o número visível é `number`).
      schema: { type: string, example: ord_1042 }
    MemberId:
      name: memberId
      in: path
      required: true
      schema: { type: string }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      description: Cursor opaco retornado em `page.nextCursor`.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID gerado pelo app; repetir a chamada com a mesma chave não repete o efeito.
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: ETag do evento lido; evita sobrescrever edição feita por outro membro.
      schema: { type: string }

  responses:
    ValidationError:
      description: Dados inválidos (campos).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RuleViolation:
      description: Regra de negócio impediu a operação (ver `code` e `rule`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Token ausente, inválido ou expirado.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InvalidCredentials:
      description: Credenciais ou código inválidos (mensagem genérica).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AccountLocked:
      description: Muitas tentativas; tente após `retryAfterSeconds` (RN30).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: O papel do usuário não permite a operação.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Recurso não existe ou não pertence às produtoras do usuário (RN15).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: "Conflito com o estado atual, por exemplo e-mail já cadastrado (RN14)."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Gone:
      description: Link, convite ou token expirado.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionFailed:
      description: O recurso mudou desde a leitura (If-Match).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: Arquivo acima do limite.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Limite de chamadas atingido.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ─── Comuns ───
    Problem:
      type: object
      description: Erro no formato RFC 9457.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, example: https://api.arclou.com/problems/event-not-publishable }
        title: { type: string, example: O evento ainda não pode ser publicado }
        status: { type: integer, example: 409 }
        detail: { type: string, example: Cadastre pelo menos um tipo de ingresso. }
        code: { type: string, example: EVENT_WITHOUT_TICKET_TYPES }
        rule: { type: string, description: 'Regra de negócio violada, quando houver.', example: RN04 }
        retryAfterSeconds: { type: integer }
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string, example: 'ticketTypes[2].quantity' }
              code: { type: string, example: QUANTITY_MUST_BE_POSITIVE }
              message: { type: string, example: A quantidade deve ser maior que zero. }
    Money:
      type: object
      description: Valor em centavos (nunca ponto flutuante).
      required: [amount, currency]
      properties:
        amount: { type: integer, example: 32000 }
        currency: { type: string, const: BRL }
    Page:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: {} }
        page:
          type: object
          required: [hasMore]
          properties:
            nextCursor: { type: [string, 'null'] }
            hasMore: { type: boolean }
    Target:
      type: object
      description: Para onde o app navega ao tocar (alertas, notificações, busca).
      required: [kind, id]
      properties:
        kind: { type: string, enum: [EVENT, EVENT_TICKETS, ORDER, ORDER_LIST, MEMBER, PAYOUTS, DASHBOARD] }
        id: { type: [string, 'null'] }
        filter: { type: object, additionalProperties: { type: string }, example: { status: PENDING } }
    Delta:
      type: object
      properties:
        percent: { type: number, example: 12.4 }
        trend: { type: string, enum: [UP, DOWN, FLAT] }

    # ─── Enums ───
    EventStatus:
      type: string
      enum: [DRAFT, PUBLISHED, CANCELLED, FINISHED]
      description: Rascunho, Publicado, Cancelado, Encerrado.
    EventFormat:
      type: string
      enum: [IN_PERSON, ONLINE, HYBRID]
    SalesState:
      type: string
      enum: [NOT_STARTED, OPEN, PAUSED, CLOSED, SOLD_OUT, NONE]
      description: Estado de venda de um evento publicado (RN18). `NONE` para rascunho/cancelado/encerrado.
    OrderStatus:
      type: string
      enum: [PENDING, CONFIRMED, CANCELLED]
    PaymentMethod:
      type: string
      enum: [PIX, CARD, BOLETO, FREE]
    TicketStatus:
      type: string
      enum: [ISSUED, USED, CANCELLED]
      description: Ciclo do ADR-0002 (a partir da V5).
    MemberRole:
      type: string
      enum: [OWNER, ADMIN, FINANCE, CHECK_IN]
    RefundState:
      type: string
      enum: [NONE, PARTIAL, FULL]

    # ─── Auth ───
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: vinicius@arclou.com }
        password: { type: string }
        deviceName: { type: string, example: iPhone 15 Pro }
    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, example: 900 }
    LoginResponse:
      oneOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required: [twoFactorRequired, challengeToken]
          properties:
            twoFactorRequired: { type: boolean, const: true }
            challengeToken: { type: string }
    TwoFactorLoginRequest:
      type: object
      required: [challengeToken]
      properties:
        challengeToken: { type: string }
        code: { type: string, pattern: '^[0-9]{6}$' }
        recoveryCode: { type: string, example: 7KQ2-9XMP }
        trustDevice: { type: boolean, default: false, description: Não pedir 2FA neste aparelho por 30 dias. }
    PasskeyOptions:
      type: object
      required: [challenge]
      properties:
        challenge: { type: string }
        rpId: { type: string, example: arclou.com }
        timeoutMs: { type: integer, example: 60000 }
    PasskeyAssertion:
      type: object
      description: Resposta WebAuthn do aparelho (campos base64url).
      required: [credentialId, clientDataJSON]
      properties:
        credentialId: { type: string }
        clientDataJSON: { type: string }
        authenticatorData: { type: string }
        signature: { type: string }
        attestationObject: { type: string }
    SignupRequest:
      type: object
      required: [name, email, password, acceptTerms]
      properties:
        name: { type: string, example: Vinicius Pereira }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        acceptTerms: { type: boolean, const: true }
        marketingOptIn: { type: boolean, default: false, description: Novidades por e-mail (opcional — LGPD). }
        organization:
          type: object
          description: Só no app (AC-B3). Ausente = conta sem produtora (site, AC-A2).
          required: [name, city]
          properties:
            name: { type: string, example: Arclou Produções }
            city: { type: string, example: 'São Paulo, SP' }
    SignupResponse:
      type: object
      required: [verificationToken, emailMasked]
      properties:
        verificationToken: { type: string }
        emailMasked: { type: string, example: v•••••@arclou.com }
    InvitationPreview:
      type: object
      required: [organization, role, email, invitedBy, expiresAt, hasAccount]
      properties:
        organization:
          type: object
          properties:
            name: { type: string, example: Arclou Produções }
            logoUrl: { type: [string, 'null'] }
        role: { $ref: '#/components/schemas/MemberRole' }
        email: { type: string, format: email, example: julia.rocha@gmail.com }
        invitedBy: { type: string, example: Vinicius Pereira }
        expiresAt: { type: string, format: date-time }
        hasAccount: { type: boolean, description: 'Se já existe conta com esse e-mail, o app pede só a senha.' }

    # ─── Me ───
    Me:
      type: object
      required: [id, name, email, emailVerified, twoFactorEnabled, memberships]
      properties:
        id: { type: string }
        name: { type: string, example: Vinicius Pereira }
        email: { type: string, format: email }
        emailVerified: { type: boolean }
        phone: { type: [string, 'null'], example: (11) 98765-4321 }
        photoUrl: { type: [string, 'null'] }
        twoFactorEnabled: { type: boolean }
        marketingOptIn: { type: boolean }
        passwordChangedAt: { type: [string, 'null'], format: date-time }
        stats:
          type: object
          description: Números do card do perfil.
          properties:
            events: { type: integer, example: 4 }
            ticketsSold: { type: integer, example: 1284 }
            revenue: { $ref: '#/components/schemas/Money' }
        memberships:
          type: array
          items:
            type: object
            required: [organizationId, organizationName, role]
            properties:
              organizationId: { type: string }
              organizationName: { type: string }
              organizationSlug: { type: string }
              role: { $ref: '#/components/schemas/MemberRole' }
    MeUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        phone: { type: [string, 'null'] }
        marketingOptIn: { type: boolean }
    Session:
      type: object
      required: [id, deviceName, lastSeenAt, current]
      properties:
        id: { type: string }
        deviceName: { type: string, example: Galaxy S23 · App Arclou }
        city: { type: string, example: 'São Paulo, SP' }
        lastSeenAt: { type: string, format: date-time }
        current: { type: boolean }
        trustedUntil: { type: [string, 'null'], format: date-time }
    TwoFactorSetup:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret: { type: string, example: JBSWY3DPEHPK3PXP }
        otpauthUri: { type: string, example: 'otpauth://totp/Arclou:vinicius@arclou.com?secret=JBSWY3DPEHPK3PXP&issuer=Arclou' }
    RecoveryCodes:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          minItems: 10
          maxItems: 10
          items: { type: string, example: 7KQ2-9XMP }
    Passkey:
      type: object
      properties:
        id: { type: string }
        deviceName: { type: string, example: iPhone 15 Pro }
        createdAt: { type: string, format: date-time }
    DeletionEligibility:
      type: object
      required: [canDelete, blockers]
      properties:
        canDelete: { type: boolean }
        blockers:
          type: array
          items:
            type: object
            required: [code, title, description]
            properties:
              code: { type: string, enum: [EVENTS_ON_SALE, PENDING_BALANCE, OWNS_TEAM] }
              title: { type: string, example: 3 eventos à venda }
              description: { type: string, example: 'Encerre ou cancele Tech Summit 2026, Noite do Jazz e Meetup Backend BR.' }
              target: { $ref: '#/components/schemas/Target' }
    Notification:
      type: object
      required: [id, type, title, createdAt]
      properties:
        id: { type: string }
        type: { type: string, enum: [NEW_ORDER, LOW_STOCK, PENDING_ORDERS, ORDER_CANCELLED, REFUND, INVITATION, WEEKLY_SUMMARY, SOLD_OUT, EVENT_REMINDER] }
        title: { type: string, example: 'Novo pedido #1042' }
        body: { type: string, example: 'Ana Souza · 2× VIP · R$ 320,00' }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, 'null'], format: date-time }
        target: { $ref: '#/components/schemas/Target' }
    NotificationPreferences:
      type: object
      required: [channels, events]
      properties:
        channels:
          type: object
          description: Sem SMS (removido do produto).
          properties:
            email: { type: boolean }
            push: { type: boolean }
        events:
          type: object
          properties:
            newOrder: { type: boolean }
            pendingOver24h: { type: boolean }
            refundRequested: { type: boolean }
            orderCancelled: { type: boolean }
            lowStock90: { type: boolean }
            soldOut: { type: boolean }
            eventReminder24h: { type: boolean }
            weeklySummary: { type: boolean }
        weeklySummaryAt:
          type: object
          properties:
            weekday: { type: string, enum: [MON, TUE, WED, THU, FRI, SAT, SUN] }
            time: { type: string, example: '08:00' }

    # ─── Organizations & Team ───
    Organization:
      type: object
      required: [id, name, slug, publicUrl, settings]
      properties:
        id: { type: string }
        name: { type: string, example: Arclou Produções }
        slug: { type: string, example: arclou-producoes }
        publicUrl: { type: string, example: https://arclou.com/o/arclou-producoes }
        city: { type: string }
        about: { type: string, maxLength: 300 }
        logoUrl: { type: [string, 'null'] }
        coverUrl: { type: [string, 'null'] }
        instagram: { type: [string, 'null'] }
        website: { type: [string, 'null'] }
        contactEmail: { type: [string, 'null'], format: email }
        showPastEvents: { type: boolean }
        showTicketsSold: { type: boolean }
        stats:
          type: object
          properties:
            events: { type: integer, example: 4 }
            ticketsSold: { type: integer, example: 1456 }
        settings: { $ref: '#/components/schemas/OrganizationSettings' }
        security: { $ref: '#/components/schemas/OrganizationSecurity' }
    OrganizationSettings:
      type: object
      properties:
        language: { type: string, example: pt-BR }
        timezone: { type: string, example: America/Sao_Paulo }
        currency: { type: string, const: BRL }
        dateFormat: { type: string, example: DD/MM/AAAA }
        defaultMaxPerOrder: { type: integer, default: 6, description: RN19 }
        refundPolicyDays: { type: integer, default: 7, description: RN24 }
        passFeeToBuyer: { type: boolean, default: true, description: RN17 }
        waitlistDefault: { type: boolean, default: false, description: RN22 — padrão para tipos novos. }
    OrganizationSecurity:
      type: object
      properties:
        require2faForTeam: { type: boolean }
        approveNewDevices: { type: boolean }
        confirmSensitiveActions: { type: boolean, description: Senha ao mudar dados bancários. }
        sessionTimeoutDays: { type: integer, example: 30 }
    OrganizationUpdate:
      type: object
      properties:
        name: { type: string }
        slug: { type: string, description: Mudar quebra links já compartilhados. }
        city: { type: string }
        about: { type: string, maxLength: 300 }
        instagram: { type: [string, 'null'] }
        website: { type: [string, 'null'] }
        contactEmail: { type: [string, 'null'], format: email }
        showPastEvents: { type: boolean }
        showTicketsSold: { type: boolean }
        settings: { $ref: '#/components/schemas/OrganizationSettings' }
        security: { $ref: '#/components/schemas/OrganizationSecurity' }
    ActivityEntry:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [NEW_DEVICE_LOGIN, API_KEY_CREATED, BANK_ACCOUNT_CHANGED, MEMBER_JOINED, MEMBER_REMOVED, PASSWORD_CHANGED] }
        description: { type: string, example: 'Galaxy S23 · São Paulo, SP' }
        actorName: { type: [string, 'null'], example: Vinicius Pereira }
        createdAt: { type: string, format: date-time }
    Member:
      type: object
      required: [id, role, status]
      properties:
        id: { type: string }
        role: { $ref: '#/components/schemas/MemberRole' }
        status: { type: string, enum: [INVITED, ACTIVE] }
        user:
          type: [object, 'null']
          properties:
            id: { type: string }
            name: { type: string }
            email: { type: string, format: email }
            photoUrl: { type: [string, 'null'] }
        invitedEmail: { type: [string, 'null'], format: email }
        expiresAt: { type: [string, 'null'], format: date-time }
        isYou: { type: boolean }

    # ─── Dashboard ───
    Dashboard:
      type: object
      required: [stage, kpis, attention, upcomingEvents, recentOrders]
      properties:
        stage: { type: string, enum: [FIRST_ACCESS, EVENT_CREATED, PUBLISHED_NO_SALES, WITH_DATA] }
        onboarding:
          type: [object, 'null']
          description: Presente enquanto houver passos (0/3…3/3).
          properties:
            completed: { type: integer, example: 1 }
            total: { type: integer, example: 3 }
            steps:
              type: array
              items:
                type: object
                properties:
                  key: { type: string, enum: [CREATE_EVENT, CONFIGURE_TICKETS, PUBLISH] }
                  status: { type: string, enum: [DONE, CURRENT, UPCOMING] }
                  eventId: { type: [string, 'null'] }
        justPublished:
          type: [object, 'null']
          description: Banner "<evento> está no ar!".
          properties:
            eventId: { type: string }
            eventName: { type: string }
            publicUrl: { type: string }
        kpis:
          type: object
          properties:
            revenue: { $ref: '#/components/schemas/Kpi' }
            ticketsSold: { $ref: '#/components/schemas/Kpi' }
            orders: { $ref: '#/components/schemas/Kpi' }
            conversionRate: { $ref: '#/components/schemas/Kpi' }
        attention:
          type: array
          items: { $ref: '#/components/schemas/AttentionItem' }
        salesSeries:
          type: array
          items: { $ref: '#/components/schemas/SalesPoint' }
        upcomingEvents:
          type: array
          items: { $ref: '#/components/schemas/EventSummary' }
        recentOrders:
          type: array
          items: { $ref: '#/components/schemas/OrderSummary' }
    Kpi:
      type: [object, 'null']
      description: '`null` quando a métrica ainda não existe (ex.: conversão antes da V8).'
      properties:
        value: { description: Money ou número., oneOf: [{ $ref: '#/components/schemas/Money' }, { type: number }] }
        delta: { $ref: '#/components/schemas/Delta' }
        comparison: { type: string, example: vs. 30 dias anteriores }
    AttentionItem:
      type: object
      required: [type, title, tone, target]
      properties:
        type: { type: string, enum: [LOW_STOCK, PENDING_ORDERS, DRAFT_WITHOUT_TICKETS, SALES_PAUSED, CHECK_IN_TOMORROW] }
        tone: { type: string, enum: [WARNING, DANGER, NEUTRAL] }
        title: { type: string, example: Lote VIP quase esgotado }
        description: { type: string, example: Tech Summit 2026 · 92 de 100 vendidos }
        target: { $ref: '#/components/schemas/Target' }
    SalesPoint:
      type: object
      properties:
        date: { type: string, format: date }
        revenue: { $ref: '#/components/schemas/Money' }
        tickets: { type: integer }

    # ─── Events ───
    Location:
      type: object
      properties:
        venueName: { type: string, example: Expo Center Norte }
        street: { type: string, example: 'Rua José Bernardo Pinto, 333' }
        district: { type: string, example: Vila Guilherme }
        city: { type: string, example: São Paulo }
        state: { type: string, example: SP }
        zipCode: { type: string, example: 02055-000 }
        latitude: { type: [number, 'null'] }
        longitude: { type: [number, 'null'] }
    Capacity:
      type: object
      properties:
        sold: { type: integer, example: 412 }
        total: { type: integer, example: 500 }
        available: { type: integer, example: 88 }
    EventSummary:
      type: object
      required: [id, name, status, salesState]
      properties:
        id: { type: string }
        name: { type: string, example: Tech Summit 2026 }
        status: { $ref: '#/components/schemas/EventStatus' }
        salesState: { $ref: '#/components/schemas/SalesState' }
        startsAt: { type: [string, 'null'], format: date-time }
        format: { $ref: '#/components/schemas/EventFormat' }
        venueName: { type: [string, 'null'] }
        city: { type: [string, 'null'] }
        coverUrl: { type: [string, 'null'] }
        capacity: { $ref: '#/components/schemas/Capacity' }
        revenue: { $ref: '#/components/schemas/Money' }
        refundedTickets: { type: [integer, 'null'], description: Eventos cancelados. }
        warnings:
          type: array
          items: { type: string, enum: [NO_TICKET_TYPES, LOW_STOCK, SOLD_OUT] }
    EventStatusCounts:
      type: object
      properties:
        ALL: { type: integer, example: 6 }
        PUBLISHED: { type: integer, example: 3 }
        DRAFT: { type: integer, example: 1 }
        FINISHED: { type: integer, example: 1 }
        CANCELLED: { type: integer, example: 1 }
    Event:
      allOf:
        - $ref: '#/components/schemas/EventSummary'
        - type: object
          properties:
            organizationId: { type: string }
            description: { type: [string, 'null'], maxLength: 2000 }
            category: { type: [string, 'null'], example: Tecnologia }
            type: { type: [string, 'null'], example: Conferência }
            ageRating: { type: [string, 'null'], example: Livre }
            language: { type: [string, 'null'], example: pt-BR }
            endsAt: { type: [string, 'null'], format: date-time }
            gatesOpenAt: { type: [string, 'null'], format: date-time }
            location: { oneOf: [{ $ref: '#/components/schemas/Location' }, { type: 'null' }] }
            streamUrl: { type: [string, 'null'] }
            slug: { type: [string, 'null'], example: tech-summit-2026 }
            publicUrl: { type: [string, 'null'], example: https://arclou.com/e/tech-summit-2026 }
            visibility: { type: string, enum: [PUBLIC, UNLISTED] }
            publishAt: { type: [string, 'null'], format: date-time, description: Publicação agendada. }
            publishedAt: { type: [string, 'null'], format: date-time }
            salesEndAt: { type: [string, 'null'], format: date-time, example: '2026-10-12T08:00:00-03:00' }
            salesPausedAt: { type: [string, 'null'], format: date-time }
